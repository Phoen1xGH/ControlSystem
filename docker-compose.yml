version: "3.9"

networks:
  control-system-dev:
    driver: overlay

services:
  # WEB-APP    
  web_app:
    container_name: control-system-web
    image: control-system-web-app:latest
    ports:
        - "80:80"
    networks:
        - control-system-dev
    depends_on:
        - postgres_db
    secrets:
        - db_config.json
    environment:
        - ASPNETCORE_ENVIRONMENT=Docker
  
  # DB
  postgres_db:
    container_name: postgres
    image: postgres:latest
    ports:
        - "5434:5432"
    networks: 
        - control-system-dev
    volumes:
        - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
    
secrets:
  db_config.json:
     external: true