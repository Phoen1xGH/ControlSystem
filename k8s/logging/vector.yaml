apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: vector
  namespace: kube-system
spec:
  repo: https://helm.vector.dev
  chart: vector
  version: "0.57.0"
  targetNamespace: logging
  createNamespace: true
  valuesContent: |-
    role: Agent

    env:
      - name: CH_USER
        valueFrom:
          secretKeyRef:
            name: clickhouse-secret
            key: username
      - name: CH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: clickhouse-secret
            key: password

    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686
      sources:
        k8s:
          type: kubernetes_logs
          extra_field_selector: metadata.namespace=control-system
      transforms:
        parse:
          type: remap
          inputs: [k8s]
          source: |
            .namespace = to_string(.kubernetes.pod_namespace) ?? ""
            .pod = to_string(.kubernetes.pod_name) ?? ""
            .container = to_string(.kubernetes.container_name) ?? ""
            .raw = to_string(.message) ?? ""
            parsed, err = parse_json(.raw)
            .is_app = err == null && is_object(parsed)
            if .is_app { .clef = parsed }
        route:
          type: route
          inputs: [parse]
          route:
            app: '.is_app == true'
        to_app:
          type: remap
          inputs: [route.app]
          source: |
            clef = object(.clef) ?? {}
            ts = parse_timestamp(to_string(clef."@t") ?? "", "%Y-%m-%dT%H:%M:%S%.fZ") ?? now()
            . = {
              "timestamp": format_timestamp(ts, "%Y-%m-%d %H:%M:%S%.3f") ?? "",
              "level": to_string(clef."@l") ?? "Information",
              "message": to_string(clef."@m") ?? "",
              "template": to_string(clef."@mt") ?? "",
              "source_context": to_string(clef.SourceContext) ?? "",
              "operation": to_string(clef.Operation) ?? "",
              "request_id": to_string(clef.RequestId) ?? "",
              "request_path": to_string(clef.RequestPath) ?? "",
              "exception": to_string(clef."@x") ?? "",
              "namespace": .namespace,
              "pod": .pod,
              "container": .container
            }
        to_infra:
          type: remap
          inputs: [route._unmatched]
          source: |
            . = {
              "timestamp": format_timestamp(.timestamp, "%Y-%m-%d %H:%M:%S%.3f") ?? format_timestamp(now(), "%Y-%m-%d %H:%M:%S%.3f") ?? "",
              "namespace": .namespace,
              "pod": .pod,
              "container": .container,
              "message": .raw
            }
      sinks:
        ch_app:
          type: clickhouse
          inputs: [to_app]
          endpoint: http://clickhouse.logging.svc.cluster.local:8123
          database: logs
          table: app_logs
          skip_unknown_fields: true
          auth:
            strategy: basic
            user: ${CH_USER}
            password: ${CH_PASSWORD}
        ch_infra:
          type: clickhouse
          inputs: [to_infra]
          endpoint: http://clickhouse.logging.svc.cluster.local:8123
          database: logs
          table: infra_logs
          skip_unknown_fields: true
          auth:
            strategy: basic
            user: ${CH_USER}
            password: ${CH_PASSWORD}
