apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: control-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: control-system-web-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "512Mi"
          #   limits:
          #     cpu: "500m"
          #     memory: "2Gi"

          volumeMounts:
            - name: db-config
              mountPath: "/config/secrets/db"
              readOnly: true
            - name: redis-config
              mountPath: "/config/secrets/redis"
              readOnly: true 
      volumes:
        - name: db-config
          secret:
            secretName: db-config
        - name: redis-config
          secret:
            secretName: redis-config