apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: control-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9.1.2-alpine
        args:
        - "--requirepass"
        - "$(VALKEY_PASSWORD)"
        - "--appendonly"
        - "yes"
        - "--dir"
        - "/data"
        env:
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valkey-pass
              key: password
        ports:
        - containerPort: 6379
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: valkey-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
      volumes:
      - name: valkey-data
        persistentVolumeClaim:
          claimName: valkey-pvc
