apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-barman
  namespace: control-system
spec:
  retentionPolicy: "3d"
  configuration:
    destinationPath: s3://pg-backups
    endpointURL: http://rustfs.control-system.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-secret
        key: access_key
      secretAccessKey:
        name: rustfs-secret
        key: secret_key
    wal:
      compression: gzip
