image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
#  CONTAINER_TEST_IMAGE: registry.git.pve.drasill.ru/timesense/control-system:$CI_BUILD_REF_NAME
  CONTAINER_RELEASE_IMAGE: registry.git.pve.drasill.ru/timesense/control-system:$CI_COMMIT_TAG
  
stages:
  - build
  - test
  - push

.ci_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - when: never

cache:
  key: nuget
  paths:
    - /root/.nuget/packages/

build:
  stage: build
  extends: .ci_rules
  script:
    - dotnet build ControlSystem.MainApp/ControlSystem.MainApp.csproj -c $CONFIGURATION

test:
  stage: test
  extends: .ci_rules
  script:
    - dotnet test ControlSystem.Tests/ControlSystem.Tests.csproj -c $CONFIGURATION
  
push_image:
    stage: push
    image: docker:29.2.1-cli
    services:
      - name: docker:29.2.1-dind
        alias: docker
    variables:
      DOCKER_TLS_CERTDIR: ""
    rules:
      - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
    script:
      - docker login registry.git.pve.drasill.ru -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
      - docker build -t $CONTAINER_RELEASE_IMAGE .
      - docker push $CONTAINER_RELEASE_IMAGE

