image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  
  APP_RELEASE_IMAGE: $CI_REGISTRY_IMAGE
  MIGRATOR_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/migrator
  
  APP_PROJECT: ControlSystem.MainApp/ControlSystem.MainApp.csproj
  TEST_PROJECT: ControlSystem.Tests/ControlSystem.Tests.csproj
  MIGRATOR_DOCKERFILE: ControlSystem.Migrator/Dockerfile
 
  DOCKER_CLI_VERSION: 29.2.1-cli
  DOCKER_DIND_VERSION: 29.2.1-dind
  
stages:
  - build
  - test
  - push
  - deploy

.ci_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - when: never

cache:
  key: nuget
  paths:
    - /root/.nuget/packages/

build:
  stage: build
  extends: .ci_rules
  script:
    - dotnet build $APP_PROJECT -c $CONFIGURATION

test:
  stage: test
  extends: .ci_rules
  script:
    - dotnet test $TEST_PROJECT -c $CONFIGURATION
  
push:
  stage: push
  image: docker:$DOCKER_CLI_VERSION
  services:
    - name: docker:$DOCKER_DIND_VERSION
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    - docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

    - docker build -t $APP_RELEASE_IMAGE:$CI_COMMIT_TAG .
    - docker tag $APP_RELEASE_IMAGE:$CI_COMMIT_TAG $APP_RELEASE_IMAGE:latest
    - docker push $APP_RELEASE_IMAGE:$CI_COMMIT_TAG
    - docker push $APP_RELEASE_IMAGE:latest
    
    - docker build -f $MIGRATOR_DOCKERFILE -t $MIGRATOR_RELEASE_IMAGE:$CI_COMMIT_TAG .
    - docker push $MIGRATOR_RELEASE_IMAGE:$CI_COMMIT_TAG

deploy:
  stage: deploy
  # Публичный образ с kubectl + kustomize + helm (Docker Hub). Минор = версия кластера (1.35).
  image: alpine/k8s:1.35.6
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  script:
    # Доступ к кластеру через GitLab Agent (agentk). Контекст = <путь_проекта>:<имя_агента>.
    # Никакого KUBE_CONFIG и открытого API k3s наружу не нужно.
    - kubectl config use-context timesense/controlsystem:k3s
    - cd k8s

    # Подставляем тег коммита в оба образа
    - kustomize edit set image control-system-web-app=$APP_RELEASE_IMAGE:$CI_COMMIT_TAG
    - kustomize edit set image controlsystem-migrator=$MIGRATOR_RELEASE_IMAGE:$CI_COMMIT_TAG

    # Проверяем, что подстановка реально произошла (иначе задеплоится старый образ)
    - kustomize build . | grep -E 'image: .*:'"$CI_COMMIT_TAG"

    # Job миграций иммутабелен — пересоздаём перед применением
    - kubectl delete job migrator -n control-system --ignore-not-found

    - kubectl apply -k .

    # Ждём миграции, затем раскатку приложения.
    # 300s — на первый деплой CNPG поднимает Postgres с нуля (образ + initdb), это долго.
    - kubectl wait --for=condition=complete job/migrator -n control-system --timeout=300s
    - kubectl rollout status deployment/web-app -n control-system --timeout=300s