image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  
  APP_RELEASE_IMAGE: $CI_REGISTRY_IMAGE
  MIGRATOR_RELEASE_IMAGE: $CI_REGISTRY_IMAGE-migrator
  
  APP_PROJECT: ControlSystem.MainApp/ControlSystem.MainApp.csproj
  TEST_PROJECT: ControlSystem.Tests/ControlSystem.Tests.csproj
  MIGRATOR_DOCKERFILE: ControlSystem.Migrator/Dockerfile
 
  DOCKER_CLI_VERSION: 29.2.1-cli
  DOCKER_DIND_VERSION: 29.2.1-dind
  
stages:
  - build
  - test
  - push

.ci_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - when: never

cache:
  key: nuget
  paths:
    - /root/.nuget/packages/

build:
  stage: build
  extends: .ci_rules
  script:
    - dotnet build $APP_PROJECT -c $CONFIGURATION

test:
  stage: test
  extends: .ci_rules
  script:
    - dotnet test $TEST_PROJECT -c $CONFIGURATION
  
push:
  stage: push
  image: docker:$DOCKER_CLI_VERSION
  services:
    - name: docker:$DOCKER_DIND_VERSION
      alias: docker
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

    - docker build -t $APP_RELEASE_IMAGE:$CI_COMMIT_TAG .
    - docker push $APP_RELEASE_IMAGE:$CI_COMMIT_TAG
    
    - docker build -f $MIGRATOR_DOCKERFILE -t $MIGRATOR_RELEASE_IMAGE:$CI_COMMIT_TAG .
    - docker push $MIGRATOR_RELEASE_IMAGE:$CI_COMMIT_TAG