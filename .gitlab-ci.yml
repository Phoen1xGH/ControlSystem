image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  CI_BRANCH: "release/main"

stages:
  - restore
  - build
  - test

# =========================
# RULES
# =========================
.ci_rules:
  rules:
     # MR â release/main
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "$CI_BRANCH"'
    # Push â release/main  
    - if: '$CI_COMMIT_BRANCH == "$CI_BRANCH"'
    - when: never

# =========================
# CACHE
# =========================
cache:
  key: nuget
  paths:
    - /root/.nuget/packages/

# =========================
# BUILD
# =========================
build:
  stage: build
  extends: .ci_rules
  script:
    - dotnet restore ControlSystem.sln
    - dotnet build ControlSystem.sln -c $CONFIGURATION --no-restore

# =========================
# TEST
# =========================
test:
  stage: test
  extends: .ci_rules
  script:
    - dotnet restore ControlSystem.sln
    - dotnet test ControlSystem.Tests/ControlSystem.Tests.csproj \
        -c $CONFIGURATION \
        --no-build